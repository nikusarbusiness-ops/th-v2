
name: Build TreasureHunt Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and Verify TreasureHunt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Project Files
        run: |
          test -f pom.xml || {
            echo "ERROR: pom.xml fehlt!"
            exit 1
          }

          test -f TreasureHuntPlugin.java || {
            echo "ERROR: TreasureHuntPlugin.java fehlt!"
            exit 1
          }

          test -f plugin.yml || {
            echo "ERROR: plugin.yml fehlt!"
            exit 1
          }

      - name: Prepare Maven Project
        run: |
          mkdir -p src/main/java/de/powersmp/treasurehunt
          mkdir -p src/main/resources

          cp TreasureHuntPlugin.java \
            src/main/java/de/powersmp/treasurehunt/

          cp plugin.yml src/main/resources/
          cp config.yml src/main/resources/
          cp messages.yml src/main/resources/

          echo "Projektstruktur vorbereitet."

      - name: Build Plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify Plugin JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR=$(find target -maxdepth 1 -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: Keine JAR gefunden!"
            exit 1
          fi

          jar tf "$JAR" > jar-content.txt

          grep -Fxq "plugin.yml" jar-content.txt
          grep -Fxq "config.yml" jar-content.txt
          grep -Fxq "messages.yml" jar-content.txt
          grep -Fxq "de/powersmp/treasurehunt/TreasureHuntPlugin.class" jar-content.txt

          mkdir -p release
          cp "$JAR" release/TreasureHunt.jar

          echo "SUCCESS: Plugin-JAR erfolgreich geprüft!"

      - name: Upload Finished JAR
        uses: actions/upload-artifact@v4
        with:
          name: TreasureHunt-JAR
          path: release/TreasureHunt.jar
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/TreasureHunt.jar
          generate_release_notes: true
