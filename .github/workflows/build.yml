
name: Build TreasureHunt Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate Maven Project
        run: mvn --batch-mode validate

      - name: Compile and Build JAR
        run: mvn --batch-mode clean package

      - name: Verify JAR
        run: |
          JAR=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" > /dev/null
          mkdir -p release
          cp "$JAR" release/TreasureHunt.jar
          echo "JAR successfully built and verified."

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreasureHunt-JAR
          path: release/TreasureHunt.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/TreasureHunt.jar
          generate_release_notes: true
