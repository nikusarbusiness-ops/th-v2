name: Build Plugin JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Dateien in src/ zusammensetzen
        run: |
          mkdir -p src/main/java src/main/resources

          # Falls TreasureHuntPlugin.java im Root liegt, in src/main/java kopieren
          if [ -f "TreasureHuntPlugin.java" ]; then
            cp TreasureHuntPlugin.java src/main/java/
          fi

          # YAML-Dateien aus dem Root nach src/main/resources kopieren
          for f in plugin.yml config.yml messages.yml; do
            if [ -f "$f" ]; then
              cp "$f" src/main/resources/
            fi
          done

      - name: Mit Maven kompilieren und als JAR verpacken
        run: mvn -B clean package

      - name: Fertige JAR als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: TreasureHuntPlugin-jar
          path: target/*.jar
          if-no-files-found: error
