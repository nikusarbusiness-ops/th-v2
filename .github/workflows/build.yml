
name: Build TreasureHunt Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and Verify TreasureHunt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Required Project Files
        run: |
          test -f pom.xml || {
            echo "ERROR: pom.xml fehlt!"
            exit 1
          }

          test -f src/main/resources/plugin.yml || {
            echo "ERROR: src/main/resources/plugin.yml fehlt!"
            exit 1
          }

      - name: Build Plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Find and Verify Plugin JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR=$(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: Keine Plugin-JAR gefunden!"
            exit 1
          fi

          echo "Gefundene JAR: $JAR"

          jar tf "$JAR" > jar-content.txt

          grep -Fxq "plugin.yml" jar-content.txt || {
            echo "ERROR: plugin.yml fehlt im Stammverzeichnis der JAR!"
            exit 1
          }

          grep -Fq "TreasureHuntPlugin.class" jar-content.txt || {
            echo "ERROR: TreasureHuntPlugin.class fehlt!"
            exit 1
          }

          mkdir -p release
          cp "$JAR" release/TreasureHunt.jar

          echo "SUCCESS: JAR und plugin.yml erfolgreich geprüft!"

      - name: Upload Finished JAR
        uses: actions/upload-artifact@v4
        with:
          name: TreasureHunt-JAR
          path: release/TreasureHunt.jar
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/TreasureHunt.jar
          generate_release_notes: true
