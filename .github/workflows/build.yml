
name: Build TreasureHunt Plugin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Plugin with Maven
        run: mvn -B clean package

      - name: Prepare ZIP Folder
        run: |
          mkdir -p release/TreasureHunt
          mkdir -p release/TreasureHunt/source

          cp -r src release/TreasureHunt/source/
          cp pom.xml release/TreasureHunt/source/
          cp README* release/TreasureHunt/source/ 2>/dev/null || true

          cp target/*.jar release/TreasureHunt/

          cp -r .github release/TreasureHunt/source/.github 2>/dev/null || true

      - name: Create ZIP
        run: |
          cd release
          zip -r TreasureHunt.zip TreasureHunt

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreasureHunt
          path: release/TreasureHunt.zip
          if-no-files-found: error
          compression-level: 9
