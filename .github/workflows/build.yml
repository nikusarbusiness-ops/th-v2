
name: Build TreasureHunt ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 21 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Projekt vollständig kompilieren
        run: mvn --batch-mode clean package

      - name: ZIP-Verzeichnis vorbereiten
        run: |
          mkdir -p output/TreasureHunt

          # Gesamtes Projekt übernehmen
          rsync -a \
            --exclude='.git/' \
            --exclude='target/' \
            --exclude='output/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            ./ output/TreasureHunt/

          # Fertige Plugin-JAR hinzufügen
          mkdir -p output/TreasureHunt/build
          cp target/*.jar output/TreasureHunt/build/

      - name: ZIP erstellen
        run: |
          cd output
          zip -r -9 TreasureHunt.zip TreasureHunt

      - name: ZIP-Inhalt kontrollieren
        run: |
          test -s output/TreasureHunt.zip
          unzip -t output/TreasureHunt.zip
          echo "ZIP erfolgreich erstellt und geprüft."

      - name: Fertige ZIP veröffentlichen
        uses: actions/upload-artifact@v4
        with:
          name: TreasureHunt-Complete
          path: output/TreasureHunt.zip
          if-no-files-found: error
          compression-level: 9
